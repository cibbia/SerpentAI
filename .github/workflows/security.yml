name: Security Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 4 * * 1'

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install project & pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install .[full]  # install extras for audit
          pip install pip-audit
      - name: Run pip-audit
        run: pip-audit --exit-code 1